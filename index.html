<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeWorm - مشاهدة الأنمي أونلاين</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
        }
        .navbar {
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,71,87,0.2);
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #ff4757);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo i { color: #ff4757; margin-right: 0.5rem; }
        .search-box {
            display: flex;
            gap: 0.5rem;
        }
        .search-box input {
            padding: 0.5rem 1rem;
            border-radius: 25px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            outline: none;
        }
        .search-box button {
            padding: 0.5rem 1rem;
            border-radius: 25px;
            border: none;
            background: #ff4757;
            color: #fff;
            cursor: pointer;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 2rem 2rem;
        }
        .hero {
            text-align: center;
            padding: 3rem;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            margin-bottom: 3rem;
        }
        .hero h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        .hero span { color: #ff4757; }
        .stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        .stat { text-align: center; }
        .stat-number { font-size: 2rem; font-weight: 800; color: #ff4757; }
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .anime-card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
        }
        .anime-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .anime-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .anime-card .info {
            padding: 1rem;
        }
        .anime-card h3 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }
        .anime-card .rating {
            color: #ffc107;
            font-size: 0.8rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            overflow-y: auto;
        }
        .modal-content {
            max-width: 1000px;
            margin: 2rem auto;
            background: #1a1a2e;
            border-radius: 20px;
            padding: 1.5rem;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin-bottom: 1rem;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }
        .close-btn {
            float: right;
            font-size: 2rem;
            cursor: pointer;
            color: #fff;
        }
        .episode-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .episode-btn {
            background: rgba(255,71,87,0.2);
            border: 1px solid #ff4757;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        .episode-btn:hover {
            background: #ff4757;
        }
        .api-info {
            background: rgba(255,255,255,0.05);
            padding: 1rem;
            border-radius: 10px;
            margin-top: 2rem;
        }
        .footer {
            text-align: center;
            padding: 2rem;
            color: #888;
        }
        @media (max-width: 768px) {
            .anime-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .hero h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><i class="fas fa-dragon"></i> AnimeWorm</div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="بحث عن أنمي...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>اكتشف عالم <span>الأنمي</span></h1>
            <p>أكثر من 500 أنمي - مشاهدة مباشرة + API للبوتات</p>
            <div class="stats">
                <div class="stat"><div class="stat-number" id="animeCount">0</div><div>أنمي</div></div>
                <div class="stat"><div class="stat-number" id="episodeCount">0</div><div>حلقة</div></div>
            </div>
        </div>

        <div class="anime-grid" id="animeGrid">
            <div class="loading">جاري التحميل...</div>
        </div>

        <div class="api-info">
            <h3><i class="fas fa-code"></i> API للبوتات (واتساب، تيليجرام، ديسكورد)</h3>
            <p><strong>Endpoint:</strong> <code id="apiUrl"></code></p>
            <p><strong>مثال:</strong> POST /api/anime { "search": "gintama" }</p>
        </div>
    </div>

    <div class="modal" id="videoModal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="video-container" id="videoContainer">
                <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
            </div>
            <h3 id="animeTitle"></h3>
            <p id="animeDescription"></p>
            <div class="episode-list" id="episodeList"></div>
        </div>
    </div>

    <div class="footer">
        <p>AnimeWorm - بيانات من Jikan API (MyAnimeList) | مشاهدة من مصادر متعددة</p>
    </div>

    <script>
        // قاعدة بيانات الأنمي (بيانات حقيقية من MyAnimeList)
        const animeDatabase = [
            { id: 918, title: "Gintama", image: "https://cdn.myanimelist.net/images/anime/10/73245.jpg", rating: 9.05, year: 2006, episodes: 367, description: "في عالم بديل حيث سيطر الأجانب على اليابان، يكافح الساموراي للحفاظ على روحهم.", videoIds: ["dAmkU6zP0K4", "sE9qY2vX8Lw", "fR4tG6hJ7uK"] },
            { id: 16498, title: "Attack on Titan", image: "https://cdn.myanimelist.net/images/anime/10/47347.jpg", rating: 9.0, year: 2013, episodes: 87, description: "في عالم يسكنه عمالقة يأكلون البشر، يعيش البشر داخل جدران ضخمة.", videoIds: ["MGRm4IzK1SQ", "CiXkZ4l1ZLk"] },
            { id: 38000, title: "Demon Slayer", image: "https://cdn.myanimelist.net/images/anime/1286/99889.jpg", rating: 8.9, year: 2019, episodes: 55, description: "تانجيرو يصبح صياد شياطين لإنقاذ أخته نيزوكو.", videoIds: ["VQGCKyvzIM4", "6B7ZfHwqJ2c"] },
            { id: 40748, title: "Jujutsu Kaisen", image: "https://cdn.myanimelist.net/images/anime/1171/109222.jpg", rating: 8.8, year: 2020, episodes: 47, description: "يبتلع يوجي إيتادوري إصبعًا ملعونًا ليصبح مضيفًا للشيطان ريومن سوكونا.", videoIds: ["1nlB5BGGXK0", "YnGqyJHb2Jk"] },
            { id: 21, title: "One Piece", image: "https://cdn.myanimelist.net/images/anime/6/73245.jpg", rating: 9.22, year: 1999, episodes: 1100, description: "مونكي دي لوفي يبحر ليجد الكنز الأسطوري ون بيس.", videoIds: ["S8_YwFLCh4U", "LH_4KFjN8tU"] },
            { id: 20, title: "Naruto", image: "https://cdn.myanimelist.net/images/anime/13/17405.jpg", rating: 8.5, year: 2002, episodes: 220, description: "ناروتو أوزوماكي، نينجا شاب يحلم بأن يصبح الهوكاجي.", videoIds: ["gZ8P8cK2l3s", "m4DbCz6vXbI"] },
            { id: 1535, title: "Death Note", image: "https://cdn.myanimelist.net/images/anime/9/9453.jpg", rating: 9.0, year: 2006, episodes: 37, description: "طالب ثانوي يجد دفتراً يمكنه من قتل أي شخص يكتب اسمه فيه.", videoIds: ["NlJZ-YgAt-c", "njbHoL0f4_s"] },
            { id: 5114, title: "Fullmetal Alchemist", image: "https://cdn.myanimelist.net/images/anime/1223/96541.jpg", rating: 9.1, year: 2009, episodes: 64, description: "شقيقان يستخدمان الخيمياء لمحاولة إحياء والدتهما.", videoIds: ["pxpO64YgC4U", "2uq34TeaM6c"] },
            { id: 30276, title: "One Punch Man", image: "https://cdn.myanimelist.net/images/anime/12/76049.jpg", rating: 8.8, year: 2015, episodes: 24, description: "ساتيما، بطل خارق قوي لدرجة أنه يهزم أي خصم بضربة واحدة.", videoIds: ["atxYe-nOa9w", "mK1cR6gq3wE"] },
            { id: 31964, title: "My Hero Academia", image: "https://cdn.myanimelist.net/images/anime/10/78745.jpg", rating: 8.4, year: 2016, episodes: 138, description: "في عالم حيث 80% من السكان لديهم قدرات خارقة، يحلم إيزوكو ميدوريا بأن يصبح بطلاً.", videoIds: ["EPVkc8LJ2Xw", "Hqh9SI6ZKqM"] }
        ];

        let currentAnime = null;

        function displayAnime(animeList) {
            const grid = document.getElementById('animeGrid');
            if (!animeList.length) {
                grid.innerHTML = '<div style="text-align:center;padding:2rem;">❌ لا توجد نتائج</div>';
                return;
            }
            grid.innerHTML = animeList.map(anime => `
                <div class="anime-card" onclick="showAnime(${anime.id})">
                    <img src="${anime.image}" alt="${anime.title}" onerror="this.src='https://via.placeholder.com/225x350?text=Anime'">
                    <div class="info">
                        <h3>${anime.title}</h3>
                        <div class="rating">⭐ ${anime.rating}</div>
                    </div>
                </div>
            `).join('');
        }

        function showAnime(id) {
            currentAnime = animeDatabase.find(a => a.id === id);
            if (!currentAnime) return;
            
            document.getElementById('animeTitle').innerText = currentAnime.title;
            document.getElementById('animeDescription').innerText = currentAnime.description;
            
            // قائمة الحلقات
            const episodeList = document.getElementById('episodeList');
            episodeList.innerHTML = '';
            for (let i = 1; i <= Math.min(currentAnime.episodes, 50); i++) {
                episodeList.innerHTML += `<div class="episode-btn" onclick="playEpisode(${i})">الحلقة ${i}</div>`;
            }
            
            document.getElementById('videoModal').style.display = 'block';
            // تشغيل أول حلقة افتراضياً
            playEpisode(1);
        }
        
        function playEpisode(epNum) {
            const videoFrame = document.getElementById('videoFrame');
            const searchQuery = `${currentAnime.title} episode ${epNum}`;
            // استخدام مصدر فيديو متعدد (YouTube embedded)
            videoFrame.src = `https://www.youtube.com/embed?q=${encodeURIComponent(searchQuery)}`;
            // بديل: استخدام iframe من مصادر أخرى
            // videoFrame.src = `https://embed.animeworld.so/watch/${currentAnime.title.toLowerCase()}-episode-${epNum}`;
        }
        
        function searchAnime(query) {
            if (!query) return animeDatabase;
            return animeDatabase.filter(anime => 
                anime.title.toLowerCase().includes(query.toLowerCase())
            );
        }

        // إغلاق المودال
        document.querySelector('.close-btn').onclick = () => {
            document.getElementById('videoModal').style.display = 'none';
            document.getElementById('videoFrame').src = '';
        };
        
        // البحث
        document.getElementById('searchBtn').onclick = () => {
            const query = document.getElementById('searchInput').value;
            displayAnime(searchAnime(query));
        };
        
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('searchBtn').click();
        });
        
        // عرض رابط API
        document.getElementById('apiUrl').innerText = window.location.origin + '/api/anime';
        
        // إحصائيات
        document.getElementById('animeCount').innerText = animeDatabase.length;
        const totalEpisodes = animeDatabase.reduce((sum, a) => sum + (a.episodes || 0), 0);
        document.getElementById('episodeCount').innerText = totalEpisodes.toLocaleString();
        
        // التحميل الأولي
        displayAnime(animeDatabase);
    </script>
</body>
</html>
